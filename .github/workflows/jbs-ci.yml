name: JBS Agri Hub CI

on:
  push:
    branches:
      - main
      - "jbs/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jbs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript validation
        run: npx tsc --noEmit

  security-check:
    name: Basic secret/config guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for obvious private key material
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='package-lock.json' 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY' .; then
            echo "Private key material detected."
            exit 1
          fi
          echo "No obvious private key material detected."
